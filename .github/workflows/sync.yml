name: تحديث بيانات اللوحة

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5
      - name: سحب البيانات من الإكسل
        env:
          EXCEL_SHARE_URL: ${{ secrets.EXCEL_SHARE_URL != '' && secrets.EXCEL_SHARE_URL || 'https://1drv.ms/x/c/066a17cb861bd447/IQDSRrX7f_UfRa9B-nbsMeryASlskcHWlnXirxJoExi4MHk?e=w1mgmc' }}
        run: python scripts/sync.py
      - name: حفظ التغييرات
        run: |
          if git diff --quiet -- members.csv; then echo "لا تغييرات"; exit 0; fi
          git config user.name "moasherat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add members.csv
          git commit -m "تحديث بيانات التدريب"
          git push
