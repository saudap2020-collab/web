<style>
:root{--color-fg:#141A3A;--color-fg-muted:#636569;--color-bg:#F4F6FA;--color-panel:#FFFFFF;--color-border-line:#E3E7EF;
--cds-gap-xs:4px;--cds-gap-sm:8px;--cds-gap-md:12px;--cds-gap-lg:20px;--cds-gap-xl:32px;--cds-pad-xs:4px;--cds-pad-sm:8px;--cds-pad-md:12px;--cds-pad-lg:20px;--cds-pad-xl:32px;
--cds-radius:12px;--cds-font-size-caption:12px;--cds-font-size-body:14px;--cds-font-size-heading:17px;--cds-font-size-title:22px;--cds-font-weight-medium:500;
--cds-chart-grid:#E8ECF3;--cds-chart-axis:#B8C0CF;--cds-text-secondary:#7A8194;--cds-ease-out:cubic-bezier(.2,.8,.2,1);--font-anthropic-sans:system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--color-bg);}
.wrap{max-width:1200px;margin:0 auto;padding:24px 16px 40px}
.dash-skeleton{position:relative;min-height:60px;border-radius:12px;background:linear-gradient(90deg,rgba(0,0,0,.04),rgba(0,0,0,.08),rgba(0,0,0,.04));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.mz-updated{text-align:center;color:var(--color-fg-muted);font-size:11px}


[data-theme="dark"]{--color-fg:#EEF1F8;--color-fg-muted:#A3AAC2;--color-bg:#070B24;--color-panel:#10173F;--color-border-line:rgba(255,255,255,.09);
--cds-chart-grid:rgba(255,255,255,.09);--cds-chart-axis:rgba(255,255,255,.28);--cds-text-secondary:#8D95B2;color-scheme:dark}
[data-theme="dark"] .mz-dept{box-shadow:0 1px 2px rgba(0,0,0,.3),0 12px 28px -14px rgba(0,0,0,.6)}

[data-theme="dark"] .mz-hero{box-shadow:0 0 0 1px rgba(255,255,255,.06)}
[data-theme="dark"] .dash-skeleton{background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04));background-size:200% 100%}
body{transition:background-color .3s ease}
.mz-side{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.mz-theme{display:inline-flex;align-items:center;gap:6px;padding:4px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
.mz-theme button{all:unset;cursor:pointer;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;color:rgba(255,255,255,.7);transition:background .2s,color .2s}
.mz-theme button:hover{color:#fff}
.mz-theme button[aria-pressed="true"]{background:#fff;color:#081363}
.mz-theme button:focus-visible{outline:2px solid #7FD3E0;outline-offset:2px}
.mz-theme svg{width:16px;height:16px}
</style>
<style>
.mz { --mz-navy:#081363; --mz-navy2:#103D79; --mz-teal:#2A99AD; --mz-teal2:#7FD3E0; --mz-red:#C73630; --mz-amber:#E3A33B; --mz-grey:#636569;
  direction: rtl; font-family: "IBM Plex Sans Arabic", var(--font-anthropic-sans); color: var(--color-fg); display: flex; flex-direction: column; gap: var(--cds-gap-xl); }
.mz-hero { position: relative; overflow: hidden; border-radius: calc(var(--cds-radius) * 2); color: #fff; padding: var(--cds-pad-xl);
  background: radial-gradient(120% 140% at 0% 0%, #1F4E8C 0%, transparent 55%), linear-gradient(135deg, var(--mz-navy) 0%, #0B1D6E 55%, var(--mz-navy2) 100%); }
.mz-deco { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.mz-top { position: relative; display: flex; justify-content: space-between; align-items: flex-start; gap: var(--cds-gap-lg); flex-wrap: wrap; }
.mz-logo { height: 46px; width: auto; display: block; }
.mz-kicker { font-size: var(--cds-font-size-caption); letter-spacing: .02em; color: var(--mz-teal2); margin: 0 0 6px; }
.mz-title { margin: 0; font-weight: 600; font-size: clamp(24px, 4vw, 34px); line-height: 1.25; }
.mz-title::after { content: ""; display: block; width: 64px; height: 3px; margin-top: 10px; border-radius: 2px; background: linear-gradient(90deg, var(--mz-red), var(--mz-teal)); }
.mz-lede { position: relative; margin: var(--cds-gap-md) 0 0; color: rgba(255,255,255,.82); max-width: 640px; line-height: 1.7; }
.mz-lede b { color: #fff; font-weight: 600; }
.mz-heroBody { position: relative; display: grid; grid-template-columns: minmax(240px, 1.1fr) minmax(220px, 1fr); gap: var(--cds-gap-xl); align-items: center; margin-top: var(--cds-gap-lg); }
@media (max-width: 640px) { .mz-heroBody { grid-template-columns: 1fr; } }
.mz-bigGauge { width: 100%; max-width: 400px; margin: 0 auto; min-height: 170px; position: relative; }
.mz-bigLabel { text-align: center; color: rgba(255,255,255,.75); font-size: var(--cds-font-size-body); margin-top: -4px; }
.mz-kpis { display: grid; grid-template-columns: 1fr; gap: var(--cds-gap-md); }
.mz-kpi { display: flex; align-items: center; gap: var(--cds-gap-md); padding: 14px 16px; border-radius: var(--cds-radius); background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(4px); }
.mz-kpi-ico { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.mz-kpi-ico svg { width: 20px; height: 20px; }
.mz-kpi-num { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.mz-kpi-lbl { font-size: var(--cds-font-size-caption); color: rgba(255,255,255,.72); }
.mz-legend { position: relative; display: flex; gap: var(--cds-gap-lg); flex-wrap: wrap; margin-top: var(--cds-gap-lg); font-size: var(--cds-font-size-caption); color: rgba(255,255,255,.75); }
.mz-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-left: 6px; vertical-align: -1px; }

.mz-secHead { display: flex; align-items: baseline; gap: var(--cds-gap-md); }
.mz-secHead h2 { margin: 0; font-size: var(--cds-font-size-title); font-weight: 600; color: var(--color-fg); }
.mz-secHead span { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
.mz-secHead::before { content: ""; width: 4px; align-self: stretch; border-radius: 2px; background: linear-gradient(var(--mz-teal), var(--mz-navy)); }

.mz-depts { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--cds-gap-lg); min-height: 240px; }
.mz-dept { position: relative; overflow: hidden; background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: calc(var(--cds-radius) * 1.5); padding: var(--cds-pad-lg); display: flex; flex-direction: column; gap: var(--cds-gap-md);
  box-shadow: 0 1px 2px rgba(8,19,99,.04), 0 8px 24px -12px rgba(8,19,99,.18); transition: transform .25s ease, box-shadow .25s ease; }
.mz-dept::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: linear-gradient(90deg, var(--mz-teal), var(--mz-navy)); }
@media (prefers-reduced-motion: no-preference) { .mz-dept:hover { transform: translateY(-3px); box-shadow: 0 2px 4px rgba(8,19,99,.06), 0 16px 32px -14px rgba(8,19,99,.28); } }
.mz-deptHead { display: flex; align-items: center; justify-content: space-between; gap: var(--cds-gap-sm); }
.mz-deptHead h3 { margin: 0; font-size: var(--cds-font-size-heading); font-weight: 600; }
.mz-idx { font-size: 28px; font-weight: 700; line-height: 1; color: transparent; -webkit-text-stroke: 1px var(--mz-teal); opacity: .8; font-variant-numeric: tabular-nums; }
.mz-gauge { width: 100%; max-width: 230px; margin: 0 auto; position: relative; }
.mz-gauge svg, .mz-bigGauge svg { display: block; width: 100%; height: auto; overflow: visible; }
.mz-pill { align-self: center; font-size: var(--cds-font-size-caption); padding: 3px 12px; border-radius: 999px; margin-top: -6px; }
.mz-list { width: 100%; border-collapse: collapse; }
.mz-list th { text-align: right; font-size: 11px; color: var(--color-fg-muted); font-weight: 500; padding: 0 0 6px; border-bottom: 1px solid var(--color-border-line); }
.mz-list th.mz-r { text-align: left; }
.mz-list td { padding: 10px 0; border-bottom: 1px dashed var(--color-border-line); vertical-align: middle; }
.mz-list tr:last-child td { border-bottom: 0; }
.mz-who { display: flex; align-items: flex-start; gap: 10px; }
.mz-av { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 600; }
.mz-name { font-weight: 600; font-size: var(--cds-font-size-body); line-height: 1.3; }
.mz-course { display: block; margin-top: 3px; font-size: 11px; line-height: 1.55; color: var(--color-fg-muted); padding-inline-start: 10px; position: relative; }
.mz-course::before { content: ""; position: absolute; right: 0; top: .6em; width: 5px; height: 5px; border-radius: 50%; background: var(--mz-teal); }
.mz-pct { width: 64px; padding-inline-start: 8px !important; text-align: left; font-variant-numeric: tabular-nums; font-weight: 600; font-size: var(--cds-font-size-caption); }
.mz-bar { height: 6px; border-radius: 4px; background: var(--cds-chart-grid); margin-top: 5px; overflow: hidden; }
.mz-bar > span { display: block; height: 100%; border-radius: 4px; }
@media (prefers-reduced-motion: no-preference) { .mz-bar > span { animation: mzGrow 1s var(--cds-ease-out, ease-out) both; transform-origin: right; } @keyframes mzGrow { from { transform: scaleX(0); } } }
.mz-fail { color: var(--color-fg-muted); text-align: center; padding: var(--cds-pad-lg); }
.mz-foot { text-align: center; color: var(--color-fg-muted); font-size: 11px; }
</style>
</head>

    <div class="mz-legend">
      <span><i style="background: var(--mz-teal)"></i>٨٠٪ فأكثر</span>
      <span><i style="background: var(--mz-amber)"></i>٦٠–٧٩٪</span>
      <span><i style="background: var(--mz-red)"></i>أقل من ٦٠٪</span>
    </div>
  </section>

  <div class="mz-secHead" id="departments-head"><h2>الإدارات</h2><span>متوسط إنجاز أعضاء كل إدارة</span></div>
  <section class="mz-depts" id="departments" data-draw="depts"></section>
  <div class="mz-updated" id="updated"></div>
  <div class="mz-foot">مؤشرات · Moasherat</div>
</div>


</main>

<script>
const DATA_URL = 'members.csv';
const REFRESH_MS = 60 * 1000;
const tone = (v) => v >= 80 ? ['#2A99AD', '#7FD3E0'] : v >= 60 ? ['#E3A33B', '#F6CF7E'] : ['#C73630', '#EE8A84'];
const label = (v) => v >= 80 ? 'متقدم' : v >= 60 ? 'متوسط' : 'يحتاج دعم';
const fmt = (v) => (Math.round(v * 10) / 10) + '%';
const motion = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: no-preference)').matches);
let uid = 0, firstDraw = true, lastText = null;
const $ = (s) => document.querySelector(s);

function gauge(el, value, o) {
  el.replaceChildren();
  const W = 220, r = 92, thick = o.thick || 16, H = r + 34;
  const [c1, c2] = tone(value);
  const id = 'mzg' + (++uid);
  const svg = d3.select(el).append('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('role', 'img').attr('aria-label', `${o.label}: ${fmt(value)}`);
  const lg = svg.append('defs').append('linearGradient').attr('id', id).attr('x1', '0').attr('x2', '1');
  lg.append('stop').attr('offset', '0').attr('stop-color', c2);
  lg.append('stop').attr('offset', '1').attr('stop-color', c1);
  const g = svg.append('g').attr('transform', `translate(${W / 2},${r + 10})`);
  const arc = d3.arc().innerRadius(r - thick).outerRadius(r).cornerRadius(thick / 2).startAngle(-Math.PI / 2);
  for (let i = 0; i <= 10; i++) {
    const a = -Math.PI / 2 + Math.PI * i / 10, r1 = r + 5, r2 = r + (i % 5 === 0 ? 10 : 7);
    g.append('line').attr('x1', Math.sin(a) * r1).attr('y1', -Math.cos(a) * r1).attr('x2', Math.sin(a) * r2).attr('y2', -Math.cos(a) * r2)
      .style('stroke', o.dark ? 'rgba(255,255,255,.35)' : 'var(--cds-chart-axis)').style('stroke-width', i % 5 === 0 ? 1.5 : 1);
  }
  g.append('path').attr('d', arc({ endAngle: Math.PI / 2 })).style('fill', o.dark ? 'rgba(255,255,255,.12)' : 'var(--cds-chart-grid)');
  const target = -Math.PI / 2 + Math.PI * Math.max(0, Math.min(100, value)) / 100;
  const fg = g.append('path').style('fill', `url(#${id})`);
  const capR = r - thick / 2;
  const cap = g.append('circle').attr('r', thick / 2 + 3).style('fill', o.dark ? '#081363' : 'var(--color-panel)').style('stroke', c1).style('stroke-width', 3);
  const t = g.append('text').attr('text-anchor', 'middle').attr('y', -8).style('font-weight', 600)
    .style('font-size', o.big ? '34px' : '30px').style('fill', o.dark ? '#fff' : 'var(--color-fg)').style('font-variant-numeric', 'tabular-nums');
  const place = (a, val) => { fg.attr('d', arc({ endAngle: a })); cap.attr('cx', Math.sin(a) * capR).attr('cy', -Math.cos(a) * capR); t.text(fmt(val)); };
  if (!motion() || !firstDraw) place(target, value);
  else {
    place(-Math.PI / 2, 0);
    fg.transition().duration(1200).ease(d3.easeCubicOut).tween('g', () => { const ia = d3.interpolate(-Math.PI / 2, target), iv = d3.interpolate(0, value); return (k) => place(ia(k), k === 1 ? value : Math.round(iv(k))); });
  }
  const lab = (x, s) => g.append('text').attr('x', x).attr('y', 20).attr('text-anchor', 'middle').style('font-size', '10px').style('fill', o.dark ? 'rgba(255,255,255,.6)' : 'var(--cds-text-secondary)').text(s);
  lab(-r + thick / 2, '0%'); lab(r - thick / 2, '100%');
}

function count(el, n) {
  el.classList.remove('dash-skeleton');
  if (!motion() || !firstDraw) { el.textContent = n; return; }
  d3.select(el).transition().duration(1000).ease(d3.easeCubicOut).tween('t', () => { const i = d3.interpolateRound(0, n); return (k) => { el.textContent = i(k); }; });
}

function render(members) {
  members = members.filter((m) => m.member && m.department).map((m) => ({ ...m, progress: +String(m.progress).replace('%', '') || 0 }));
  const overall = members.length ? d3.mean(members, (m) => m.progress) : 0;
  const depts = d3.rollups(members, (rs) => ({ avg: d3.mean(rs, (m) => m.progress), count: rs.length }), (m) => m.department)
    .map(([department, v]) => ({ department, ...v }));
  const top = d3.greatest(depts, (d) => d.avg);

  $('[data-draw="overallTxt"]').textContent = fmt(overall);
  $('[data-draw="topDept"]').textContent = top ? `${top.department} (${fmt(top.avg)})` : '—';
  const big = $('[data-draw="overallGauge"]'); big.classList.remove('dash-skeleton');
  gauge(big, overall, { label: 'الإنجاز العام', big: true, thick: 22, dark: true });
  count($('[data-draw="kMembers"]'), members.length);
  count($('[data-draw="kHigh"]'), members.filter((m) => m.progress >= 80).length);
  count($('[data-draw="kLow"]'), members.filter((m) => m.progress < 60).length);

  const el = $('[data-draw="depts"]'); el.classList.remove('dash-skeleton'); el.replaceChildren();
  const avColors = ['#081363', '#2A99AD', '#103D79', '#C73630', '#008DA2', '#636569'];
  const initials = (n) => String(n).trim().split(/\s+/).slice(0, 2).map((w) => w.replace(/^ال/, '').charAt(0)).join('');
  const mk = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  depts.forEach((dep, i) => {
    const [c1] = tone(dep.avg);
    const card = mk('article', 'mz-dept');
    const head = mk('div', 'mz-deptHead');
    head.append(mk('h3', null, dep.department), mk('span', 'mz-idx', String(i + 1).padStart(2, '0')));
    card.append(head);
    const gw = mk('div', 'mz-gauge'); card.append(gw);
    gauge(gw, dep.avg, { label: dep.department });
    const pill = mk('div', 'mz-pill', `${label(dep.avg)} · ${dep.count} أعضاء`);
    pill.style.background = c1 + '1F'; pill.style.color = c1; card.append(pill);
    const tbl = mk('table', 'mz-list');
    const hr = tbl.createTHead().insertRow();
    hr.append(mk('th', null, 'العضو والدورة'), mk('th', 'mz-r', 'الإكمال'));
    const tb = tbl.createTBody();
    members.filter((r) => r.department === dep.department).sort((a, b) => b.progress - a.progress).forEach((r, j) => {
      const tr = tb.insertRow();
      const who = mk('div', 'mz-who');
      const av = mk('div', 'mz-av', initials(r.member)); av.style.background = avColors[(i + j) % avColors.length];
      const txt = mk('div'); txt.append(mk('div', 'mz-name', r.member), mk('span', 'mz-course', r.course));
      who.append(av, txt); tr.insertCell().append(who);
      const p = tr.insertCell(); p.className = 'mz-pct';
      const [pc1, pc2] = tone(r.progress);
      const val = mk('span', null, r.progress + '%'); val.style.color = pc1;
      const bar = mk('div', 'mz-bar'); const fill = mk('span');
      fill.style.width = Math.max(0, Math.min(100, r.progress)) + '%';
      fill.style.background = `linear-gradient(270deg, ${pc2}, ${pc1})`;
      if (firstDraw) fill.style.animationDelay = (j * 80) + 'ms'; else fill.style.animation = 'none';
      bar.append(fill); p.append(val, bar);
    });
    card.append(tbl); el.append(card);
  });
  firstDraw = false;
  $('#updated').textContent = 'آخر تحديث: ' + new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
}

async function load() {
  try {
    const res = await fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const text = (await res.text()).replace(/^﻿/, '');
    if (text === lastText) return;
    lastText = text;
    render(d3.csvParse(text));
  } catch (e) {
    if (lastText == null) $('[data-draw="depts"]').replaceChildren(Object.assign(document.createElement('div'), { className: 'mz-fail', textContent: 'تعذّر تحميل البيانات' }));
  }
}
document.querySelectorAll('[data-draw="overallGauge"],[data-draw="depts"],.mz-kpi-num').forEach((e) => e.classList.add('dash-skeleton'));
function syncTheme(){const cur=document.documentElement.getAttribute('data-theme');document.querySelectorAll('.mz-theme button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===cur)));}
document.querySelectorAll('.mz-theme button').forEach(b=>b.addEventListener('click',()=>{document.documentElement.setAttribute('data-theme',b.dataset.mode);try{localStorage.setItem('mz-theme',b.dataset.mode)}catch(e){}syncTheme();if(lastText){const keep=lastText;lastText=null;firstDraw=false;render(d3.csvParse(keep));lastText=keep;}}));
if(window.matchMedia){matchMedia('(prefers-color-scheme: dark)').addEventListener('change',e=>{let s=null;try{s=localStorage.getItem('mz-theme')}catch(_){}if(!s){document.documentElement.setAttribute('data-theme',e.matches?'dark':'light');syncTheme();}});}
syncTheme();
load();
setInterval(load, REFRESH_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</body>
</html>
